apiVersion: v1
kind: ConfigMap
metadata:
  name: vsfx-config
  namespace: vsfx
data:
  VSFX_ENV: "production"
  VSFX_SERVER__HOST: "0.0.0.0"
  VSFX_SERVER__PORT: "8000"
  VSFX_SERVER__PUBLIC_BASE_URL: "https://sfx.example.com"
  VSFX_SERVER__CORS_ORIGINS: '["https://sfx.example.com","https://app.example.com"]'
  VSFX_SERVER__REQUEST_TIMEOUT_S: "300"
  VSFX_SERVER__MAX_UPLOAD_BYTES: "536870912"
  VSFX_DATABASE__DB_POOL_SIZE: "10"
  VSFX_DATABASE__DB_MAX_OVERFLOW: "20"
  VSFX_DATABASE__DB_STATEMENT_TIMEOUT_MS: "15000"
  VSFX_REDIS__QUEUE_STREAM_NAME: "vsfx:jobs"
  VSFX_REDIS__QUEUE_GROUP: "vsfx-workers"
  VSFX_STORAGE__S3_ENDPOINT_URL: "http://vsfx-minio:9000"
  VSFX_STORAGE__S3_BUCKET: "vsfx"
  VSFX_STORAGE__S3_FORCE_PATH_STYLE: "true"
  VSFX_STORAGE__S3_KEY_PREFIX: "vsfx"
  VSFX_MEDIA__MAX_VIDEO_DURATION_S: "300"
  VSFX_MODEL__MODEL_VARIANT: "small_16k"
  VSFX_MODEL__AUDIO_SAMPLE_RATE: "16000"
  VSFX_JOBS__JOB_MAX_ATTEMPTS: "3"
  VSFX_JOBS__WORK_DIR: "/srv/work"
  VSFX_AUTH__AUTH_REQUIRED: "true"
  VSFX_AUTH__RATE_LIMIT_RPM: "60"
  VSFX_AUTH__CONCURRENT_JOBS_PER_KEY: "3"
  VSFX_SAFETY__SAFETY_ENABLED: "true"
  VSFX_SAFETY__SAFETY_BLOCKLIST_PATH: "/srv/config/safety_blocklist.txt"
  VSFX_WEBHOOK__WEBHOOK_ENABLED: "true"
  VSFX_TELEMETRY__LOG_LEVEL: "INFO"
  VSFX_TELEMETRY__METRICS_ENABLED: "true"
