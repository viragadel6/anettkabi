apiVersion: v1
kind: Secret
metadata:
  name: vsfx-secrets
  namespace: vsfx
type: Opaque
stringData:
  VSFX_DATABASE__DATABASE_URL: "postgresql+asyncpg://vsfx:REPLACE_ME@vsfx-postgres:5432/vsfx"
  VSFX_REDIS__REDIS_URL: "redis://vsfx-redis:6379/0"
  VSFX_STORAGE__S3_ACCESS_KEY_ID: "REPLACE_ME"
  VSFX_STORAGE__S3_SECRET_ACCESS_KEY: "REPLACE_ME"
  VSFX_WEBHOOK__WEBHOOK_SIGNING_SECRET: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME"
