apiVersion: batch/v1
kind: Job
metadata:
  name: vsfx-migrate
  namespace: vsfx
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/example/vsfx-api:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: vsfx-config
            - secretRef:
                name: vsfx-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
