apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vsfx-minio
  namespace: vsfx
spec:
  serviceName: vsfx-minio
  replicas: 1
  selector:
    matchLabels:
      app: vsfx-minio
  template:
    metadata:
      labels:
        app: vsfx-minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-11-07T00-52-20Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: vsfx-secrets
                  key: VSFX_STORAGE__S3_ACCESS_KEY_ID
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vsfx-secrets
                  key: VSFX_STORAGE__S3_SECRET_ACCESS_KEY
          ports:
            - containerPort: 9000
              name: s3
            - containerPort: 9001
              name: console
          volumeMounts:
            - name: miniodata
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: miniodata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vsfx-minio
  namespace: vsfx
spec:
  selector:
    app: vsfx-minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vsfx-minio-init
  namespace: vsfx
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2024-11-05T11-29-28Z
          env:
            - name: MC_HOST_local
              value: http://$(MINIO_ROOT_USER):$(MINIO_ROOT_PASSWORD)@vsfx-minio:9000
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: vsfx-secrets
                  key: VSFX_STORAGE__S3_ACCESS_KEY_ID
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vsfx-secrets
                  key: VSFX_STORAGE__S3_SECRET_ACCESS_KEY
          command:
            - /bin/sh
            - -c
            - mc mb --ignore-existing local/vsfx && mc anonymous set download local/vsfx
