[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "anettkabi-task-engine"
version = "1.0.0"
description = "Enterprise-grade distributed task orchestration engine with ACID persistence, cryptographic idempotency validation, distributed lease coordination, transactional outbox messaging, and self-healing failover."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "viragadel6" }]
keywords = [
    "task-orchestration",
    "distributed-systems",
    "outbox-pattern",
    "idempotency",
    "postgresql",
    "redis",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "anyio>=4.4.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "redis[hiredis]>=5.0.8",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    "opentelemetry-instrumentation-fastapi>=0.47b0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "testcontainers[postgres,redis]>=4.8.0",
]

[project.scripts]
task-engine-worker = "worker.lifecycle:main"

[tool.hatch.build.targets.wheel]
packages = [
    "api",
    "coordination",
    "domain",
    "observability",
    "repositories",
    "worker",
]

[tool.hatch.build.targets.wheel.force-include]
"config.py" = "config.py"
"database.py" = "database.py"
"models.py" = "models.py"
"schemas.py" = "schemas.py"
"alembic.ini" = "alembic.ini"
"migrations" = "migrations"

[tool.hatch.build.targets.sdist]
include = [
    "api",
    "coordination",
    "domain",
    "observability",
    "repositories",
    "worker",
    "migrations",
    "config.py",
    "database.py",
    "models.py",
    "schemas.py",
    "alembic.ini",
    "pyproject.toml",
    "README.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: integration tests requiring PostgreSQL and Redis containers",
]

[tool.coverage.run]
branch = true
source = [
    "api",
    "coordination",
    "domain",
    "observability",
    "repositories",
    "worker",
    "config.py",
    "database.py",
    "models.py",
    "schemas.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
