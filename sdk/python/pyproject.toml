[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vsfx-client"
version = "1.0.0"
description = "Python client SDK for the Video-to-Video SFX service"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "vsfx" }]
keywords = ["sfx", "sound-design", "video", "generative-audio"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = ["httpx>=0.27,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.urls]
Homepage = "https://example.com/vsfx"

[tool.hatch.build.targets.wheel]
packages = ["vsfx_client"]
